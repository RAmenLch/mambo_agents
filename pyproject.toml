[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mambo-agents"
version = "0.2.0b37"
description = "AI Agent framework on LangChain/LangGraph — multi-backend filesystem, sub-agent scheduling, conversation summarization, security review, and skills system out of the box."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "RAmenLch" },
]
keywords = [
    "ai",
    "agent",
    "langchain",
    "langgraph",
    "llm",
    "multi-agent",
    "filesystem",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain>=1.2,<2",
    "langgraph>=1.1,<2",
    "langchain_core>=1.4,<2",
    "paramiko>=4.0,<5",
    "wcmatch>=8.0,<10",
    "pydantic>2.13,<3.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-c>=0.24.2,<0.25",
    "tree-sitter-cpp>=0.23.4,<0.24",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-rust>=0.24.2,<0.25",
    "langchain-mcp-adapters>=0.2.1,<1",
]

[project.urls]
Homepage = "https://github.com/RAmenLch/mambo_agents"
Source = "https://github.com/RAmenLch/mambo_agents"
Issues = "https://github.com/RAmenLch/mambo_agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mambo_agents"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that call real LLM APIs (deselect with '-m \"not integration\"')"
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-xdist>=3.8,<4",
    "langchain-openai>=1.2,<2",
    "langchain-mcp-adapters>=0.2.1,<1",
    "python-dotenv>=1.0,<2",
]
