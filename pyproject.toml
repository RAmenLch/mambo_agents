[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mambo-agents"
version = "0.2.0a1"
description = "AI Agent framework on LangChain/LangGraph — multi-backend filesystem, sub-agent scheduling, conversation summarization, security review, and skills system out of the box."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "RAmenLch" },
]
keywords = [
    "ai",
    "agent",
    "langchain",
    "langgraph",
    "llm",
    "multi-agent",
    "filesystem",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain>=1.2",
    "langgraph>=1.1",
    "deepagents>=0.5.7", # 仅用于代码参考 后续删除
    "paramiko>=3.0",
    "wcmatch>=8.0",
    "tree-sitter>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
]

[project.urls]
Homepage = "https://github.com/RAmenLch/mambo_agents"
Source = "https://github.com/RAmenLch/mambo_agents"
Issues = "https://github.com/RAmenLch/mambo_agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mambo_agents"]

[project.scripts]
mambo-chat = "mambo_agents.cli.chat:main"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that call real LLM APIs (deselect with '-m \"not integration\"')"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8",
    "langchain-openai>=1.2",
]
